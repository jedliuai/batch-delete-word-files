name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.18.0

      - name: Validate source
        run: python -m py_compile main.py

      - name: Build executable
        run: pyinstaller --onefile --windowed --name BatchDeleteWordFiles main.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/BatchDeleteWordFiles.exe"
          --title "Word 文档批量删除工具 ${{ github.ref_name }}"
          --generate-notes
